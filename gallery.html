<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Yael</title>
<meta name="description" content="The full gallery of Yael — fine art photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="loader" id="loader"><span>Yael</span></div>

<header class="site-header scrolled" id="siteHeader">
  <nav class="nav">
    <a href="index.html" class="logo">Yael</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="page-hero">
  <div class="section-heading">
    <p class="eyebrow">Full Gallery</p>
    <h2>Gallery</h2>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="portrait">Portraits</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="events">Events</button>
    <button class="filter-btn" data-filter="bw">Black & White</button>
  </div>
</section>

<section class="gallery-section full-gallery">
  <div class="masonry">
    <figure class="masonry-item tall" data-category="portrait"><img src="https://picsum.photos/seed/g1/800/1100" alt="Portrait 1" loading="lazy"><figcaption>Portrait // 2025</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="https://picsum.photos/seed/g2/800/600" alt="Nature 1" loading="lazy"><figcaption>Nature // 2025</figcaption></figure>
    <figure class="masonry-item" data-category="bw"><img src="https://picsum.photos/seed/g3/800/900" alt="Black and white 1" loading="lazy"><figcaption>Black & White // 2024</figcaption></figure>
    <figure class="masonry-item tall" data-category="events"><img src="https://picsum.photos/seed/g4/800/1100" alt="Event 1" loading="lazy"><figcaption>Events // 2024</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="https://picsum.photos/seed/g5/800/700" alt="Portrait 2" loading="lazy"><figcaption>Portrait // 2024</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="https://picsum.photos/seed/g6/800/650" alt="Nature 2" loading="lazy"><figcaption>Nature // 2023</figcaption></figure>
    <figure class="masonry-item tall" data-category="bw"><img src="https://picsum.photos/seed/g7/800/1050" alt="Black and white 2" loading="lazy"><figcaption>Black & White // 2023</figcaption></figure>
    <figure class="masonry-item" data-category="events"><img src="https://picsum.photos/seed/g8/800/620" alt="Event 2" loading="lazy"><figcaption>Events // 2023</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="https://picsum.photos/seed/g9/800/950" alt="Portrait 3" loading="lazy"><figcaption>Portrait // 2023</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="https://picsum.photos/seed/g10/800/700" alt="Nature 3" loading="lazy"><figcaption>Nature // 2022</figcaption></figure>
    <figure class="masonry-item tall" data-category="portrait"><img src="https://picsum.photos/seed/g11/800/1100" alt="Portrait 4" loading="lazy"><figcaption>Portrait // 2022</figcaption></figure>
    <figure class="masonry-item" data-category="bw"><img src="https://picsum.photos/seed/g12/800/680" alt="Black and white 3" loading="lazy"><figcaption>Black & White // 2022</figcaption></figure>
  </div>
</section>

<footer class="site-footer">
  <p>© <span id="year"></span> Yael — All rights reserved</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
