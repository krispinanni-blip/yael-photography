<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Yael</title>
<meta name="description" content="The full gallery of Yael — fine art photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="loader" id="loader"><span>Yael</span></div>

<header class="site-header scrolled" id="siteHeader">
  <nav class="nav">
    <a href="index.html" class="logo">Yael Iluz</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="page-hero">
  <div class="section-heading">
    <p class="eyebrow">Full Gallery</p>
    <h2>Gallery</h2>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="portrait">Portraits</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
  </div>
</section>

<section class="gallery-section full-gallery">
  <div class="masonry">
    <figure class="masonry-item"><img src="images/gallery/curtain.jpg" alt="Draped curtain, studio" loading="lazy"><figcaption>Fine Art // Studio</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="images/gallery/garden.jpg" alt="Garden fountain, pastel tones" loading="lazy"><figcaption>Nature</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="images/gallery/figure-study.jpg" alt="Figure study, seated" loading="lazy"><figcaption>Portrait</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="images/gallery/butterflies.jpg" alt="Butterflies on a fruit plate" loading="lazy"><figcaption>Nature</figcaption></figure>
    <figure class="masonry-item" data-category="nature"><img src="images/gallery/snow.jpg" alt="Melting snow, abstract" loading="lazy"><figcaption>Nature // Abstract</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="images/gallery/back-portrait.jpg" alt="Bare back portrait against a wall" loading="lazy"><figcaption>Portrait</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="images/gallery/bath.jpg" alt="Figure study in a bathtub" loading="lazy"><figcaption>Portrait</figcaption></figure>
    <figure class="masonry-item" data-category="portrait"><img src="images/gallery/water.jpg" alt="Figure wading into water" loading="lazy"><figcaption>Portrait</figcaption></figure>
  </div>
</section>

<footer class="site-footer">
  <p>© <span id="year"></span> Yael — All rights reserved</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
